<svg viewBox="-12.0 -12.0 1046.0 401.0" role="img" aria-label="Sunlight flux and required collector diameter versus orbital distance: direct photosynthesis is viable inside about 3 AU; beyond it the collector to deliver a fixed 15 GW grows without bound" xmlns="http://www.w3.org/2000/svg"><style><![CDATA[
*{box-sizing:border-box}body{margin:0}
  .page{background:radial-gradient(1100px 640px at 82% -6%,rgba(84,207,124,.13),transparent 60%),radial-gradient(900px 520px at 6% 3%,rgba(79,214,208,.11),transparent 55%),#0a1512;color:#e2f0e8;font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.6;letter-spacing:.005em;overflow-x:hidden;min-height:100vh}
  .wrap{max-width:1180px;margin:0 auto;padding:0 22px}
  h1,h2,h3{font-family:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif;font-weight:600;text-wrap:balance;line-height:1.1;margin:0}
  p{margin:0 0 1em}strong{color:#e2f0e8;font-weight:600}a{color:#4fd6d0}

  /* program nav */
  .prog-nav{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;font-family:ui-monospace,'SF Mono','Menlo','Cascadia Code','Roboto Mono',monospace;font-size:11px;letter-spacing:.08em;padding:16px 0 0}
  .prog-nav .pn-brand{color:#54cf7c;letter-spacing:.16em;text-transform:uppercase}
  .prog-nav a{color:#7c9689;text-decoration:none;padding:3px 10px;border:1px solid rgba(150,196,176,.16);border-radius:999px;transition:color .2s,border-color .2s}
  .prog-nav a:hover{color:#e2f0e8;border-color:rgba(150,196,176,.30)}
  .prog-nav a.current{color:#4fd6d0;border-color:#4fd6d0}

  .masthead{padding:26px 0 26px;border-bottom:1px solid rgba(150,196,176,.30)}
  .mh-kicker{font-family:ui-monospace,'SF Mono','Menlo','Cascadia Code','Roboto Mono',monospace;font-size:12px;letter-spacing:.26em;text-transform:uppercase;color:#54cf7c;margin:0 0 16px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
  .mh-kicker .round{color:#e6ac6d;border:1px solid #e6ac6d;border-radius:999px;padding:2px 10px;letter-spacing:.14em}
  .mh-title{font-size:clamp(2.2rem,6.2vw,4.2rem);letter-spacing:-.015em;margin:0 0 6px}
  .mh-title .s{color:#54cf7c}
  .mh-sub{font-size:1.12rem;color:#a9c2b6;max-width:70ch}
  .mh-sub .em{font-family:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif;font-style:italic;color:#e6ac6d}

  .section{padding:44px 0;border-bottom:1px solid rgba(150,196,176,.16)}
  .sec-eyebrow{font-family:ui-monospace,'SF Mono','Menlo','Cascadia Code','Roboto Mono',monospace;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#7c9689;display:flex;align-items:center;gap:.7em;margin:0 0 18px}
  sup.cite{font-size:.62em;line-height:0;vertical-align:super;font-family:ui-monospace,'SF Mono','Menlo','Cascadia Code','Roboto Mono',monospace;font-weight:600}
  sup.cite a{color:#4fd6d0;text-decoration:none;padding:0 1px}
  sup.cite a:hover{text-decoration:underline}
  .refs{margin-top:16px;border-top:1px solid rgba(150,196,176,.16);padding-top:18px}
  .refs ol{margin:0;padding-left:2.4em;display:grid;gap:8px}
  .refs li{font-size:.8em;line-height:1.5;color:#a9c2b6;max-width:82ch}
  .refs .rt{color:#7c9689;font-style:italic}
  .refs-note{font-size:.8em;color:#7c9689;margin:0 0 14px;max-width:80ch}
  .tbl-wrap{overflow-x:auto}
  .section table{width:100%;border-collapse:collapse;font-size:13px;line-height:1.45}
  .section table th{text-align:left;font-family:ui-monospace,'SF Mono','Menlo','Cascadia Code','Roboto Mono',monospace;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:#7c9689;border-bottom:1px solid rgba(150,196,176,.30);padding:8px 14px 8px 0;vertical-align:bottom}
  .section table td{color:#a9c2b6;border-bottom:1px solid rgba(150,196,176,.16);padding:10px 14px 10px 0;vertical-align:top}
  .section table td b{color:#e2f0e8}
  .sec-eyebrow .num{color:#54cf7c}.sec-eyebrow .rule{flex:1;height:1px;background:rgba(150,196,176,.16)}
  .section h2{font-size:clamp(1.5rem,3.6vw,2.2rem);margin-bottom:10px}
  .section .tag{color:#a9c2b6;max-width:74ch;font-size:14.5px;margin-bottom:22px}

  /* shared platform */
  .platform{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:rgba(150,196,176,.16);border:1px solid rgba(150,196,176,.16);border-radius:12px;overflow:hidden}
  .platform .p{background:#0a1512;padding:14px 15px}
  .platform .pk{font-family:ui-monospace,'SF Mono','Menlo','Cascadia Code','Roboto Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#54cf7c;margin-bottom:6px}
  .platform .pv{font-size:13px;color:#a9c2b6;line-height:1.45}

  /* scale sheet */
  .sheet{border:1px solid rgba(150,196,176,.30);border-radius:10px;background:linear-gradient(rgba(120,196,170,.10) 1px,transparent 1px) 0 0/100% 34px,linear-gradient(90deg,rgba(120,196,170,.10) 1px,transparent 1px) 0 0/34px 100%,#0b1714;padding:8px;overflow-x:auto}
  .sheet svg{display:block;height:auto;min-width:820px;width:100%}

  /* registry */
  .registry{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:18px}
  .vessel{border:1px solid rgba(150,196,176,.30);border-radius:14px;background:#0b1714;padding:20px;display:flex;flex-direction:column;gap:14px}
  .v-head{display:flex;gap:14px;align-items:flex-start}
  .v-glyph{width:58px;height:46px;flex:none}
  .v-title{flex:1;min-width:0}
  .v-title h3{font-size:1.3rem;letter-spacing:-.01em}
  .v-bi{font-family:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif;font-style:italic;color:#a9c2b6;font-size:.92rem;margin-top:1px}
  .v-tier{font-family:ui-monospace,'SF Mono','Menlo','Cascadia Code','Roboto Mono',monospace;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;padding:2px 8px;border-radius:999px;white-space:nowrap;border:1px solid rgba(150,196,176,.30);color:#7c9689}
  .v-tier.t-pod{color:#4fd6d0;border-color:#4fd6d0}
  .v-tier.t-ship{color:#54cf7c;border-color:#54cf7c}
  .v-tier.t-mega{color:#e6ac6d;border-color:#e6ac6d}
  .v-role{font-family:ui-monospace,'SF Mono','Menlo','Cascadia Code','Roboto Mono',monospace;font-size:11px;letter-spacing:.06em;color:#a9c2b6}
  .spec{display:grid;grid-template-columns:1fr 1fr;gap:5px 14px;font-family:ui-monospace,'SF Mono','Menlo','Cascadia Code','Roboto Mono',monospace;font-size:11.5px;border-block:1px solid rgba(150,196,176,.16);padding:12px 0}
  .spec .row{display:flex;justify-content:space-between;gap:8px}
  .spec .k{color:#7c9689}.spec .val{color:#e2f0e8;font-variant-numeric:tabular-nums;text-align:right}
  .v-anat{font-size:13px;color:#a9c2b6;line-height:1.5}
  .growth{border-left:2px solid #54cf7c;padding-left:13px}
  .growth .gh{font-family:ui-monospace,'SF Mono','Menlo','Cascadia Code','Roboto Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#54cf7c;margin-bottom:9px}
  .growth .g-row{display:grid;grid-template-columns:78px 1fr;gap:10px;font-size:12.5px;margin-bottom:7px;line-height:1.4}
  .growth .g-row .gk{font-family:ui-monospace,'SF Mono','Menlo','Cascadia Code','Roboto Mono',monospace;font-size:10px;letter-spacing:.06em;color:#7c9689;padding-top:2px}
  .growth .g-row .gv{color:#a9c2b6}
  .growth .g-row .gv b{color:#e2f0e8;font-weight:600}
  .v-links{display:flex;gap:8px;flex-wrap:wrap;font-family:ui-monospace,'SF Mono','Menlo','Cascadia Code','Roboto Mono',monospace;font-size:11px}
  .v-links a{color:#4fd6d0;text-decoration:none;border-bottom:1px solid rgba(150,196,176,.30)}
  .v-links .none{color:#7c9689}

  /* dev log */
  .log-entry{border-left:2px solid #e6ac6d;padding-left:16px;margin-bottom:20px}
  .log-entry .lh{font-family:ui-monospace,'SF Mono','Menlo','Cascadia Code','Roboto Mono',monospace;font-size:11px;letter-spacing:.1em;color:#e6ac6d;margin-bottom:6px}
  .log-entry h3{font-size:1.1rem;margin-bottom:6px}
  .log-entry p{font-size:13.5px;color:#a9c2b6;margin:0;max-width:74ch}
  .backlog{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
  .backlog .b{font-family:ui-monospace,'SF Mono','Menlo','Cascadia Code','Roboto Mono',monospace;font-size:11px;color:#7c9689;border:1px dashed rgba(150,196,176,.30);border-radius:8px;padding:5px 10px}

  .notes-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
  .note{border-left:2px solid rgba(150,196,176,.30);padding:2px 0 2px 16px}
  .note .nh{font-family:ui-monospace,'SF Mono','Menlo','Cascadia Code','Roboto Mono',monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#7c9689;margin-bottom:7px}
  .note p{font-size:13px;color:#a9c2b6;margin:0;line-height:1.55}
  .note.warm{border-color:#e6ac6d}.note.grn{border-color:#54cf7c}.note.cy{border-color:#4fd6d0}
  footer{padding:24px 0 66px}
  .fbar{display:flex;flex-wrap:wrap;gap:6px 18px;font-family:ui-monospace,'SF Mono','Menlo','Cascadia Code','Roboto Mono',monospace;font-size:11px;letter-spacing:.06em;color:#7c9689;border-top:1px solid rgba(150,196,176,.16);padding-top:20px}
  .fbar .sep{color:rgba(150,196,176,.30)}
  .reveal{opacity:0;transform:translateY(12px);transition:opacity .6s ease,transform .6s ease}
  .reveal.in{opacity:1;transform:none}
  
  ::selection{background:#54cf7c;color:#0a1512}
  :focus-visible{outline:2px solid #4fd6d0;outline-offset:3px;border-radius:3px}
]]></style><rect x="-12.0" y="-12.0" width="1046.0" height="401.0" fill="#0c1613"/>
