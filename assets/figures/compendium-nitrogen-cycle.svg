        <circle cx="300" cy="60" r="36" fill="#54cf7c" fill-opacity=".12" stroke="#54cf7c"/>
        <text x="300" y="58" text-anchor="middle" font-family="'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif" font-size="15" fill="#e2f0e8">Biomass</text>
        <text x="300" y="71" text-anchor="middle" font-family="ui-monospace,'SF Mono','Menlo','Cascadia Code','Roboto Mono',monospace" font-size="7.5" fill="#7c9689">organic N</text>
        <circle cx="440" cy="200" r="36" fill="#4fd6d0" fill-opacity=".12" stroke="#4fd6d0"/>
        <text x="440" y="198" text-anchor="middle" font-family="'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif" font-size="15" fill="#e2f0e8">NH₄⁺</text>
        <text x="440" y="211" text-anchor="middle" font-family="ui-monospace,'SF Mono','Menlo','Cascadia Code','Roboto Mono',monospace" font-size="7.5" fill="#7c9689">ammonium</text>
        <circle cx="300" cy="340" r="36" fill="#4fd6d0" fill-opacity=".12" stroke="#4fd6d0"/>
        <text x="300" y="338" text-anchor="middle" font-family="'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif" font-size="15" fill="#e2f0e8">NO₂⁻</text>
        <text x="300" y="351" text-anchor="middle" font-family="ui-monospace,'SF Mono','Menlo','Cascadia Code','Roboto Mono',monospace" font-size="7.5" fill="#7c9689">nitrite</text>
        <circle cx="160" cy="200" r="36" fill="#4fd6d0" fill-opacity=".12" stroke="#4fd6d0"/>
        <text x="160" y="198" text-anchor="middle" font-family="'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif" font-size="15" fill="#e2f0e8">NO₃⁻</text>
        <text x="160" y="211" text-anchor="middle" font-family="ui-monospace,'SF Mono','Menlo','Cascadia Code','Roboto Mono',monospace" font-size="7.5" fill="#7c9689">nitrate</text>
        <text x="300" y="196" text-anchor="middle" font-family="ui-monospace,'SF Mono','Menlo','Cascadia Code','Roboto Mono',monospace" font-size="11" fill="#e6ac6d">~13 t N/day</text>
        <text x="300" y="209" text-anchor="middle" font-family="ui-monospace,'SF Mono','Menlo','Cascadia Code','Roboto Mono',monospace" font-size="8" fill="#7c9689">(habitat) cycled</text>
        <text x="510" y="120" text-anchor="middle" font-family="'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif" font-size="13" fill="#e2f0e8">N₂ pool</text>
        <text x="510" y="133" text-anchor="middle" font-family="ui-monospace,'SF Mono','Menlo','Cascadia Code','Roboto Mono',monospace" font-size="7.5" fill="#7c9689">~71 Mt buffer</text>
        <line x1="284.0" y1="103.4" x2="440.0" y2="108.6" stroke="#e6ac6d" stroke-width="1.6"/>
        <path d="M440.0 108.6 L431.6 111.9 L431.9 104.9 Z" fill="#e6ac6d"/>
        <text x="340" y="96" text-anchor="middle" font-family="ui-monospace,'SF Mono','Menlo','Cascadia Code','Roboto Mono',monospace" font-size="7.5" fill="#e6ac6d">denitrification / leak</text>
        <line x1="448.5" y1="174.7" x2="465.5" y2="161.3" stroke="#54cf7c" stroke-width="1.6"/>
        <path d="M465.5 161.3 L461.1 169.2 L456.8 163.7 Z" fill="#54cf7c"/>
        <text x="506" y="176" text-anchor="middle" font-family="ui-monospace,'SF Mono','Menlo','Cascadia Code','Roboto Mono',monospace" font-size="7.5" fill="#54cf7c">nif fixation</text>
        <text x="30" y="372" font-family="ui-monospace,'SF Mono','Menlo','Cascadia Code','Roboto Mono',monospace" font-size="9" fill="#a9c2b6">loop ~99% closed — nif re-fixes N₂→NH₃ at ~0.13 t N/day to top up leakage (16 ATP per N₂ — costly, so biology recycles)</text>
        <text x="30" y="387" font-family="ui-monospace,'SF Mono','Menlo','Cascadia Code','Roboto Mono',monospace" font-size="9" fill="#a9c2b6">nitrification costs ~4.6 g O₂ per g N (~59 t O₂/day, recovered when biomass respires) · atmospheric N₂ ≈ a millennium's reserve</text>
