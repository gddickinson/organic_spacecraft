<rect x="40" y="60" width="110" height="44" rx="8" fill="#0b1714" stroke="#4fd6d0"/><text x="95.0" y="86" text-anchor="middle" font-family="ui-monospace,'SF Mono','Menlo','Cascadia Code','Roboto Mono',monospace" font-size="12" fill="#4fd6d0">light</text>
