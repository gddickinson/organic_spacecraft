<rect x="540" y="255" width="140" height="44" rx="8" fill="#0b1714" stroke="#4fd6d0"/><text x="610.0" y="281" text-anchor="middle" font-family="ui-monospace,'SF Mono','Menlo','Cascadia Code','Roboto Mono',monospace" font-size="12" fill="#4fd6d0">circulate</text>
