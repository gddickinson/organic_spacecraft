<text x="18" y="28" font-family="ui-monospace,'SF Mono','Menlo','Cascadia Code','Roboto Mono',monospace" font-size="11" fill="#e2f0e8">Whole-body metabolism — two mouths in, heat &amp; spoil out, the rest recycled</text>
