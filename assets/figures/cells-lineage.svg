<text x="314" y="335" font-family="ui-monospace,'SF Mono','Menlo','Cascadia Code','Roboto Mono',monospace" font-size="12" fill="#e6ac6d">Resource &amp; mining</text>
<text x="546" y="334" font-family="ui-monospace,'SF Mono','Menlo','Cascadia Code','Roboto Mono',monospace" font-size="10.5" fill="#7c9689">miner · concentrator · ice-tap · radiator</text>
<path d="M134 237 C 220 237, 230 384, 300 384" fill="none" stroke="#54cf7c" stroke-opacity=".5" stroke-width="1.4"/>
<rect x="300" y="364" width="232" height="40" rx="8" fill="#0b1714" stroke="#54cf7c"/>
<text x="314" y="389" font-family="ui-monospace,'SF Mono','Menlo','Cascadia Code','Roboto Mono',monospace" font-size="12" fill="#54cf7c">Ecosystem microbiome</text>
<text x="546" y="388" font-family="ui-monospace,'SF Mono','Menlo','Cascadia Code','Roboto Mono',monospace" font-size="10.5" fill="#7c9689">N-fixer · nitrifier · saprophyte · gut</text>
<path d="M134 237 C 220 237, 230 438, 300 438" fill="none" stroke="#4fd6d0" stroke-opacity=".5" stroke-width="1.4"/>
<rect x="300" y="418" width="232" height="40" rx="8" fill="#0b1714" stroke="#4fd6d0"/>
<text x="314" y="443" font-family="ui-monospace,'SF Mono','Menlo','Cascadia Code','Roboto Mono',monospace" font-size="12" fill="#4fd6d0">Germline &amp; stem</text>
