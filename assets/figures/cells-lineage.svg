<path d="M134 237 C 220 237, 230 222, 300 222" fill="none" stroke="#4fd6d0" stroke-opacity=".5" stroke-width="1.4"/>
<rect x="300" y="202" width="232" height="40" rx="8" fill="#0b1714" stroke="#4fd6d0"/>
<text x="314" y="227" font-family="ui-monospace,'SF Mono','Menlo','Cascadia Code','Roboto Mono',monospace" font-size="12" fill="#4fd6d0">Sensing &amp; coordination</text>
