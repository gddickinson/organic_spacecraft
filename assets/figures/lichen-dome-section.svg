        <line x1="806" y1="602" x2="806" y2="626" stroke="rgba(150,196,176,.16)" stroke-width="0.8"/>
        <text x="624" y="611" font-family="ui-monospace,'SF Mono','Menlo','Roboto Mono',monospace" font-size="6.5" fill="#7c9689">DATE</text>
