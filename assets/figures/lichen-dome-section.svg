        <rect x="14" y="14" width="932" height="614" fill="none" stroke="rgba(150,196,176,.16)" stroke-width="0.8"/>
        <line x1="14" y1="548" x2="946" y2="548" stroke="rgba(150,196,176,.30)" stroke-width="1"/>
        <rect x="616" y="554" width="330" height="72" fill="none" stroke="rgba(150,196,176,.30)" stroke-width="1.2"/>
        <line x1="616" y1="578" x2="946" y2="578" stroke="rgba(150,196,176,.16)" stroke-width="0.8"/>
        <line x1="616" y1="602" x2="946" y2="602" stroke="rgba(150,196,176,.16)" stroke-width="0.8"/>
        <text x="624" y="565" font-family="ui-monospace,'SF Mono','Menlo','Roboto Mono',monospace" font-size="7" fill="#7c9689">PROJECT · GESTALT — LICHEN Surface Dome</text>
