<text x="660" y="176" text-anchor="middle" font-family="ui-monospace,'SF Mono','Menlo','Cascadia Code','Roboto Mono',monospace" font-size="10" fill="#4fd6d0">windows +</text>
<text x="660" y="192" text-anchor="middle" font-family="ui-monospace,'SF Mono','Menlo','Cascadia Code','Roboto Mono',monospace" font-size="10" fill="#4fd6d0">light-guides</text>
<line x1="598" y1="176" x2="599" y2="170" stroke="#4fd6d0" stroke-opacity=".65" stroke-width="1.5"/><path d="M599 170 L602 179 L595 178 Z" fill="#4fd6d0" fill-opacity=".8"/><text x="599" y="169" text-anchor="middle" font-family="ui-monospace,'SF Mono','Menlo','Cascadia Code','Roboto Mono',monospace" font-size="8.5" fill="#7c9689">light</text>
