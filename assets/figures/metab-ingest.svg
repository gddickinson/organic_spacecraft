<text x="316" y="196" font-family="ui-monospace,'SF Mono','Menlo','Cascadia Code','Roboto Mono',monospace" font-size="10" fill="#e6ac6d">RADIX root</text>
<circle cx="330" cy="246" r="3" fill="#e6ac6d"/>
<text x="344" y="250" font-family="ui-monospace,'SF Mono','Menlo','Cascadia Code','Roboto Mono',monospace" font-size="9.5" fill="#a9c2b6">MECHANICAL — bore &amp; grind the tip</text>
<circle cx="330" cy="274" r="3" fill="#e6ac6d"/>
<text x="344" y="278" font-family="ui-monospace,'SF Mono','Menlo','Cascadia Code','Roboto Mono',monospace" font-size="9.5" fill="#a9c2b6">CHEMICAL — acid bioleach (main)</text>
<circle cx="330" cy="302" r="3" fill="#e6ac6d"/>
<text x="344" y="306" font-family="ui-monospace,'SF Mono','Menlo','Cascadia Code','Roboto Mono',monospace" font-size="9.5" fill="#a9c2b6">THERMAL — heat ice → volatiles</text>
<line x1="304" y1="178" x2="355" y2="153" stroke="#e6ac6d" stroke-opacity=".65" stroke-width="1.5"/><path d="M355 153 L349 160 L346 154 Z" fill="#e6ac6d" fill-opacity=".8"/><text x="329" y="162" text-anchor="middle" font-family="ui-monospace,'SF Mono','Menlo','Cascadia Code','Roboto Mono',monospace" font-size="8.5" fill="#7c9689">matter</text>
