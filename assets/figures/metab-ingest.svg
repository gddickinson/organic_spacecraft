<text x="480" y="108" text-anchor="middle" font-family="'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif" font-size="15" fill="#e2f0e8">the growing body</text>
<text x="480" y="130" text-anchor="middle" font-family="ui-monospace,'SF Mono','Menlo','Cascadia Code','Roboto Mono',monospace" font-size="9" fill="#7c9689">Fe·Si·Ca·P·S · H₂O · CO₂·N · organics · light</text>
