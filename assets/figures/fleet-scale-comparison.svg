        <g><text x="60" y="154" class="t-serif" font-size="12">RADIX</text><text x="250" y="154" text-anchor="end" class="t-lab3">40 m</text><line x1="260" y1="150" x2="452.2" y2="150" class="thin" opacity=".4"/><circle cx="452.2" cy="150" r="4.8" style="fill:#e6ac6d;fill-opacity:.55;stroke:#e6ac6d"/></g>
        <g><text x="60" y="179" class="t-serif" font-size="12">VESPER</text><text x="250" y="179" text-anchor="end" class="t-lab3">50 m</text><line x1="260" y1="175" x2="463.9" y2="175" class="thin" opacity=".4"/><circle cx="463.9" cy="175" r="4.9" style="fill:#4fd6d0;fill-opacity:.55;stroke:#4fd6d0"/></g>
        <g><text x="60" y="204" class="t-serif" font-size="12">TARDIGRADE</text><text x="250" y="204" text-anchor="end" class="t-lab3">50 m</text><line x1="260" y1="200" x2="463.9" y2="200" class="thin" opacity=".4"/><circle cx="463.9" cy="200" r="4.9" style="fill:#4fd6d0;fill-opacity:.55;stroke:#4fd6d0"/></g>
        <g><text x="60" y="229" class="t-serif" font-size="12">NEREUS</text><text x="250" y="229" text-anchor="end" class="t-lab3">60 m</text><line x1="260" y1="225" x2="473.4" y2="225" class="thin" opacity=".4"/><circle cx="473.4" cy="225" r="5.0" style="fill:#4fd6d0;fill-opacity:.55;stroke:#4fd6d0"/></g>
        <g><text x="60" y="254" class="t-serif" font-size="12">TESTUDO</text><text x="250" y="254" text-anchor="end" class="t-lab3">100 m</text><line x1="260" y1="250" x2="500.0" y2="250" class="thin" opacity=".4"/><circle cx="500.0" cy="250" r="5.2" style="fill:#e6ac6d;fill-opacity:.55;stroke:#e6ac6d"/></g>
        <g><text x="60" y="279" class="t-serif" font-size="12">NAVIS</text><text x="250" y="279" text-anchor="end" class="t-lab3">120 m</text><line x1="260" y1="275" x2="509.5" y2="275" class="thin" opacity=".4"/><circle cx="509.5" cy="275" r="5.3" style="fill:#54cf7c;fill-opacity:.55;stroke:#54cf7c"/></g>
        <g><text x="60" y="304" class="t-serif" font-size="12">AMBER</text><text x="250" y="304" text-anchor="end" class="t-lab3">150 m</text><line x1="260" y1="300" x2="521.1" y2="300" class="thin" opacity=".4"/><circle cx="521.1" cy="300" r="5.4" style="fill:#54cf7c;fill-opacity:.55;stroke:#54cf7c"/></g>
        <g><text x="60" y="329" class="t-serif" font-size="12">CORAL</text><text x="250" y="329" text-anchor="end" class="t-lab3">500 m</text><line x1="260" y1="325" x2="583.9" y2="325" class="thin" opacity=".4"/><circle cx="583.9" cy="325" r="6.0" style="fill:#54cf7c;fill-opacity:.55;stroke:#54cf7c"/></g>
        <g><text x="60" y="354" class="t-serif" font-size="12">LICHEN</text><text x="250" y="354" text-anchor="end" class="t-lab3">500 m</text><line x1="260" y1="350" x2="583.9" y2="350" class="thin" opacity=".4"/><circle cx="583.9" cy="350" r="6.0" style="fill:#54cf7c;fill-opacity:.55;stroke:#54cf7c"/></g>
        <g><text x="60" y="379" class="t-serif" font-size="12">ATLAS</text><text x="250" y="379" text-anchor="end" class="t-lab3">600 m</text><line x1="260" y1="375" x2="593.4" y2="375" class="thin" opacity=".4"/><circle cx="593.4" cy="375" r="6.1" style="fill:#e6ac6d;fill-opacity:.55;stroke:#e6ac6d"/></g>
        <g><text x="60" y="404" class="t-serif" font-size="12">GRAVID</text><text x="250" y="404" text-anchor="end" class="t-lab3">1 km</text><line x1="260" y1="400" x2="620.0" y2="400" class="thin" opacity=".4"/><circle cx="620.0" cy="400" r="6.3" style="fill:#e6ac6d;fill-opacity:.55;stroke:#e6ac6d"/></g>
        <g><text x="60" y="429" class="t-serif" font-size="12">MEDUSA</text><text x="250" y="429" text-anchor="end" class="t-lab3">1 km</text><line x1="260" y1="425" x2="629.5" y2="425" class="thin" opacity=".4"/><circle cx="629.5" cy="425" r="6.4" style="fill:#e6ac6d;fill-opacity:.55;stroke:#e6ac6d"/></g>
        <g><text x="60" y="454" class="t-serif" font-size="12">POMONA</text><text x="250" y="454" text-anchor="end" class="t-lab3">2 km</text><line x1="260" y1="450" x2="656.1" y2="450" class="thin" opacity=".4"/><circle cx="656.1" cy="450" r="6.6" style="fill:#54cf7c;fill-opacity:.55;stroke:#54cf7c"/></g>
        <g><text x="60" y="479" class="t-serif" font-size="12">SOL-FORGE</text><text x="250" y="479" text-anchor="end" class="t-lab3">5 km</text><line x1="260" y1="475" x2="703.9" y2="475" class="thin" opacity=".4"/><circle cx="703.9" cy="475" r="7.1" style="fill:#e6ac6d;fill-opacity:.55;stroke:#e6ac6d"/></g>
        <g><text x="60" y="504" class="t-serif" font-size="12">ARCA</text><text x="250" y="504" text-anchor="end" class="t-lab3">10 km</text><line x1="260" y1="500" x2="740.0" y2="500" class="thin" opacity=".4"/><circle cx="740.0" cy="500" r="7.4" style="fill:#54cf7c;fill-opacity:.55;stroke:#54cf7c"/></g>
        <g><text x="60" y="529" class="t-serif" font-size="12">LEVIATHAN</text><text x="250" y="529" text-anchor="end" class="t-lab3">40 km</text><line x1="260" y1="525" x2="812.2" y2="525" class="thin" opacity=".4"/><circle cx="812.2" cy="525" r="8.1" style="fill:#54cf7c;fill-opacity:.55;stroke:#54cf7c"/></g>
        <text x="480" y="568" text-anchor="middle" class="t-lab3" font-size="11">Characteristic size (log scale) — from a 4 m SPORE lifeboat to a 40 km LEVIATHAN ark: four orders of magnitude, one lineage.</text>
      </svg>