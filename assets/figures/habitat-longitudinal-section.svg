        <text x="624" y="567" font-family="ui-monospace,'SF Mono','Menlo','Cascadia Code','Roboto Mono',monospace" font-size="6.5" fill="#7c9689">DRAWING NO.</text>
        <text x="624" y="578" font-family="ui-monospace,'SF Mono','Menlo','Cascadia Code','Roboto Mono',monospace" font-size="11" fill="#4fd6d0">GST·HAB·102</text>
        <text x="774" y="567" font-family="ui-monospace,'SF Mono','Menlo','Cascadia Code','Roboto Mono',monospace" font-size="6.5" fill="#7c9689">SCALE</text>
        <text x="774" y="578" font-family="ui-monospace,'SF Mono','Menlo','Cascadia Code','Roboto Mono',monospace" font-size="9" fill="#e2f0e8">1 : 66,700</text>
        <text x="874" y="567" font-family="ui-monospace,'SF Mono','Menlo','Cascadia Code','Roboto Mono',monospace" font-size="6.5" fill="#7c9689">REV</text>
