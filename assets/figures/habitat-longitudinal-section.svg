        <text x="624" y="554" font-family="'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif" font-size="12" fill="#e2f0e8">Longitudinal Section — Biomes &amp; Axis</text>
        <line x1="766" y1="558" x2="766" y2="582" stroke="rgba(150,196,176,.16)" stroke-width="0.8"/>
