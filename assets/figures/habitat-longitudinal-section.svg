<svg viewBox="-12.0 -12.0 1026.0 652.0" role="img" aria-label="Longitudinal section of the habitat showing biomes, the axial sun-cord, and the gravity gradient" xmlns="http://www.w3.org/2000/svg"><style><![CDATA[
*{box-sizing:border-box}body{margin:0}
  .page{background:radial-gradient(1100px 640px at 82% -6%,rgba(84,207,124,.13),transparent 60%),radial-gradient(900px 520px at 6% 3%,rgba(79,214,208,.11),transparent 55%),#0a1512;color:#e2f0e8;font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.6;letter-spacing:.005em;overflow-x:hidden;min-height:100vh}
  .wrap{max-width:1180px;margin:0 auto;padding:0 22px}
  h1,h2,h3{font-family:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif;font-weight:600;text-wrap:balance;line-height:1.1;margin:0}
  p{margin:0 0 1em}strong{color:#e2f0e8;font-weight:600}

  .masthead{padding:56px 0 26px;border-bottom:1px solid rgba(150,196,176,.30)}
  .mh-kicker{font-family:ui-monospace,'SF Mono','Menlo','Cascadia Code','Roboto Mono',monospace;font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:#54cf7c;margin:0 0 18px}
  .mh-title{font-size:clamp(2.2rem,6.4vw,4.4rem);letter-spacing:-.015em;margin:0 0 4px}
  .mh-title .s{color:#54cf7c}
  .mh-sub{font-family:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif;font-style:italic;font-size:clamp(1.05rem,2.3vw,1.4rem);color:#a9c2b6;margin:0 0 26px}
  .titleblock{display:grid;grid-template-columns:2fr 1fr;border:1px solid rgba(150,196,176,.30);border-radius:12px;overflow:hidden;background:#0b1714}
  .tb-index{padding:20px 22px;border-right:1px solid rgba(150,196,176,.16)}
  .tb-index .h,.tb-meta .h{font-family:ui-monospace,'SF Mono','Menlo','Cascadia Code','Roboto Mono',monospace;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#7c9689;margin-bottom:12px}
  .idx{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
  .idx li{display:grid;grid-template-columns:58px 1fr;gap:10px;font-size:13.5px}
  .idx .pl{font-family:ui-monospace,'SF Mono','Menlo','Cascadia Code','Roboto Mono',monospace;font-size:11.5px;color:#4fd6d0;letter-spacing:.04em;padding-top:1px}
  .idx a{color:#e2f0e8;text-decoration:none;border-bottom:1px solid transparent;transition:border-color .2s}
  .idx a:hover{border-color:rgba(150,196,176,.30)}
  .tb-meta{padding:20px 22px}
  .tb-meta .row{display:flex;justify-content:space-between;gap:12px;font-family:ui-monospace,'SF Mono','Menlo','Cascadia Code','Roboto Mono',monospace;font-size:11.5px;border-bottom:1px dotted rgba(150,196,176,.16);padding-bottom:8px;margin-bottom:9px}
  .tb-meta .row .k{color:#7c9689;letter-spacing:.06em}
  .tb-meta .row .v{color:#e2f0e8;font-variant-numeric:tabular-nums;text-align:right}

  /* vital stats strip */
  .vitals{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:22px;border:1px solid rgba(150,196,176,.16);background:rgba(150,196,176,.16);border-radius:12px;overflow:hidden}
  .vitals .c{background:#0a1512;padding:16px 16px 14px}
  .vitals .k{font-family:ui-monospace,'SF Mono','Menlo','Cascadia Code','Roboto Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#7c9689;margin-bottom:8px}
  .vitals .v{font-family:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif;font-size:clamp(1.4rem,3.4vw,1.9rem);line-height:1;letter-spacing:-.01em}
  .vitals .v .u{font-family:ui-monospace,'SF Mono','Menlo','Cascadia Code','Roboto Mono',monospace;font-size:.46em;color:#7c9689;margin-left:.28em;letter-spacing:0}
  .vitals .s{font-size:12px;color:#7c9689;margin-top:6px;line-height:1.35}

  .plate{padding:46px 0;border-bottom:1px solid rgba(150,196,176,.16)}
  .plate-head{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;margin-bottom:6px}
  .plate-no{font-family:ui-monospace,'SF Mono','Menlo','Cascadia Code','Roboto Mono',monospace;font-size:12px;letter-spacing:.16em;color:#54cf7c;white-space:nowrap}
  .plate-head h2{font-size:clamp(1.5rem,3.6vw,2.3rem);letter-spacing:-.01em}
  .plate-meta{font-family:ui-monospace,'SF Mono','Menlo','Cascadia Code','Roboto Mono',monospace;font-size:10.5px;letter-spacing:.1em;color:#7c9689;margin-left:auto;text-align:right;line-height:1.6}
  .plate-cap{color:#a9c2b6;max-width:76ch;font-size:14.5px;margin:10px 0 20px}
  sup.cite{font-size:.62em;line-height:0;vertical-align:super;font-family:ui-monospace,'SF Mono','Menlo','Cascadia Code','Roboto Mono',monospace;font-weight:600}
  sup.cite a{color:#4fd6d0;text-decoration:none;padding:0 1px}
  sup.cite a:hover{text-decoration:underline}
  .refs{margin-top:16px;border-top:1px solid rgba(150,196,176,.16);padding-top:18px}
  .refs ol{margin:0;padding-left:2.4em;display:grid;gap:8px}
  .refs li{font-size:.8em;line-height:1.5;color:#a9c2b6;max-width:82ch}
  .refs .rt{color:#7c9689;font-style:italic}
  .refs-note{font-size:.8em;color:#7c9689;margin:0 0 14px;max-width:80ch}

  .sheet{border:1px solid rgba(150,196,176,.30);border-radius:10px;background:linear-gradient(rgba(120,196,170,.10) 1px,transparent 1px) 0 0/100% 34px,linear-gradient(90deg,rgba(120,196,170,.10) 1px,transparent 1px) 0 0/34px 100%,#0b1714;padding:8px;overflow-x:auto;position:relative}
  .sheet::before,.sheet::after{content:"";position:absolute;width:12px;height:12px;border:1px solid rgba(150,196,176,.30);opacity:.6}
  .sheet::before{left:6px;top:6px;border-right:none;border-bottom:none}
  .sheet::after{right:6px;bottom:6px;border-left:none;border-top:none}
  .sheet svg{display:block;height:auto}
  .sheet.big svg{min-width:900px;width:100%}
  .sheet.med svg{min-width:840px;width:100%}

  .detail-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(268px,1fr));gap:14px}
  .detail-card{border:1px solid rgba(150,196,176,.30);border-radius:10px;background:#0b1714;padding:12px 12px 14px}
  .detail-card .dc-t{font-family:ui-monospace,'SF Mono','Menlo','Cascadia Code','Roboto Mono',monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:#4fd6d0;margin:2px 2px 8px;display:flex;justify-content:space-between;gap:8px}
  .detail-card .dc-t .n{color:#e6ac6d}
  .detail-card svg{display:block;width:100%;height:auto}
  .detail-card p{font-size:12.5px;color:#a9c2b6;margin:8px 4px 2px;line-height:1.5}

  .edge{fill:none;stroke:#e2f0e8;stroke-width:1.7;stroke-linejoin:round;stroke-linecap:round}
  .edge2{fill:none;stroke:#a9c2b6;stroke-width:1.1;stroke-linejoin:round}
  .thin{fill:none;stroke:#7c9689;stroke-width:.8}
  .thin2{fill:none;stroke:#a9c2b6;stroke-width:.9}
  .hid{fill:none;stroke:#7c9689;stroke-width:.8;stroke-dasharray:5 3;opacity:.65}
  .ctr{fill:none;stroke:#4fd6d0;stroke-width:.8;stroke-dasharray:12 3 2 3;opacity:.5}
  .dim{fill:none;stroke:#7c9689;stroke-width:.7}
  .sta{fill:none;stroke:rgba(150,196,176,.30);stroke-width:.7;stroke-dasharray:2 3}
  .f-hull{fill:#e2f0e8;fill-opacity:.05}
  .f-soil{fill:#6b7d55;fill-opacity:.5}
  .f-air{fill:#4fd6d0;fill-opacity:.05}
  .f-service{fill:#4c6a7a;fill-opacity:.28;stroke:#4c6a7a;stroke-width:1}
  .f-tendon{fill:#e6ac6d;fill-opacity:.14;stroke:#e6ac6d;stroke-width:1}
  .f-sun{fill:#4fd6d0;fill-opacity:.22;stroke:#4fd6d0;stroke-width:1.1}
  .f-water{fill:#4fd6d0;fill-opacity:.30;stroke:#4fd6d0;stroke-width:.8}
  .f-forest{fill:#54cf7c;fill-opacity:.24;stroke:#54cf7c;stroke-width:.8}
  .stroke-c{stroke:#54cf7c}.stroke-l{stroke:#4fd6d0}.stroke-o{stroke:#e6ac6d}
  .fill-c{fill:#54cf7c}.fill-l{fill:#4fd6d0}.fill-o{fill:#e6ac6d}
  .t-serif{font-family:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif;fill:#e2f0e8;font-size:14px}
  .t-lab{font-family:ui-monospace,'SF Mono','Menlo','Cascadia Code','Roboto Mono',monospace;fill:#a9c2b6;font-size:10px;letter-spacing:.1em}
  .t-lab3{font-family:ui-monospace,'SF Mono','Menlo','Cascadia Code','Roboto Mono',monospace;fill:#7c9689;font-size:9.5px;letter-spacing:.08em}
  .t-dim{font-family:ui-monospace,'SF Mono','Menlo','Cascadia Code','Roboto Mono',monospace;fill:#7c9689;font-size:9.5px;letter-spacing:.03em}
  .t-big{font-family:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif;fill:#e2f0e8;font-weight:600;font-size:24px}
  .t-acc-c{fill:#54cf7c}.t-acc-l{fill:#4fd6d0}.t-acc-o{fill:#e6ac6d}
  .human{fill:#a9c2b6;opacity:.85}

  .notes{padding:44px 0 20px}
  .notes-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
  .note{border-left:2px solid rgba(150,196,176,.30);padding:2px 0 2px 16px}
  .note .nh{font-family:ui-monospace,'SF Mono','Menlo','Cascadia Code','Roboto Mono',monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#7c9689;margin-bottom:7px}
  .note p{font-size:13px;color:#a9c2b6;margin:0;line-height:1.55}
  .note.warm{border-color:#e6ac6d}.note.grn{border-color:#54cf7c}.note.cy{border-color:#4fd6d0}
  footer{padding:24px 0 66px}
  .fbar{display:flex;flex-wrap:wrap;gap:6px 18px;font-family:ui-monospace,'SF Mono','Menlo','Cascadia Code','Roboto Mono',monospace;font-size:11px;letter-spacing:.06em;color:#7c9689;border-top:1px solid rgba(150,196,176,.16);padding-top:20px}
  .fbar .sep{color:rgba(150,196,176,.30)}
  .reveal{opacity:0;transform:translateY(12px);transition:opacity .6s ease,transform .6s ease}
  .reveal.in{opacity:1;transform:none}
  
  
  ::selection{background:#54cf7c;color:#0a1512}
  :focus-visible{outline:2px solid #4fd6d0;outline-offset:3px;border-radius:3px}
]]></style><rect x="-12.0" y="-12.0" width="1026.0" height="652.0" fill="#0c1613"/>
        <line x1="60" y1="290" x2="900" y2="290" class="ctr"/>
        <!-- outer + inner shell -->
        <path d="M200 140 L800 140 A 60 150 0 0 1 800 440 L200 440 A 60 150 0 0 1 200 140 Z" class="edge"/>
        <path d="M210 158 L792 158 A 46 132 0 0 1 792 422 L210 422 A 46 132 0 0 1 210 158 Z" class="edge2"/>

        <!-- land strips (near = bottom, far = top) -->
        <rect x="210" y="158" width="582" height="16" class="f-soil"/>
        <rect x="210" y="406" width="582" height="16" class="f-soil"/>
        <!-- rivers/lakes on near land -->
        <path d="M215 416 Q 320 410 430 416 T 700 416" class="f-water" fill="none" stroke-width="2"/>
        <ellipse cx="360" cy="415" rx="34" ry="4" class="f-water"/>
        <!-- forests -->
        <g class="fill-c" opacity=".7"><use href="#tree" x="250" y="398" width="8" height="12"/><use href="#tree" x="470" y="398" width="8" height="12"/><use href="#tree" x="620" y="398" width="8" height="12"/></g>

        <!-- biome dividers + labels -->
        <g class="sta"><line x1="308" y1="158" x2="308" y2="422"/><line x1="405" y1="158" x2="405" y2="422"/><line x1="500" y1="158" x2="500" y2="422"/><line x1="597" y1="158" x2="597" y2="422"/><line x1="694" y1="158" x2="694" y2="422"/></g>
        <g class="t-lab3" text-anchor="middle">
          <text x="259" y="440">WETLAND</text><text x="356" y="440">FOREST</text><text x="452" y="440">FARM</text><text x="548" y="440">SAVANNA</text><text x="645" y="440">URBAN</text><text x="743" y="440">RESERVE</text>
        </g>

        <!-- axial sun-cord -->
        <line x1="180" y1="290" x2="820" y2="290" stroke="#4fd6d0" stroke-width="4" stroke-linecap="round"/>
        <g class="stroke-l" opacity=".22" stroke-width="1"><line x1="260" y1="290" x2="260" y2="176"/><line x1="260" y1="290" x2="260" y2="404"/><line x1="500" y1="290" x2="500" y2="176"/><line x1="500" y1="290" x2="500" y2="404"/><line x1="700" y1="290" x2="700" y2="176"/><line x1="700" y1="290" x2="700" y2="404"/></g>

        <!-- endcap terraces -->
        <g class="thin2" fill="none" opacity=".7">
          <path d="M792 174 A 46 116 0 0 1 820 290"/><path d="M792 406 A 46 116 0 0 0 820 290"/>
          <path d="M778 190 A 32 90 0 0 1 818 290"/><path d="M778 390 A 32 90 0 0 0 818 290"/>
          <path d="M210 174 A 46 116 0 0 0 182 290"/><path d="M210 406 A 46 116 0 0 1 182 290"/>
        </g>

        <!-- de-spun hubs -->
        <g class="edge2 f-service"><rect x="150" y="276" width="34" height="28" rx="4"/><rect x="818" y="276" width="34" height="28" rx="4"/></g>

        <!-- gravity gradient ladder (right) -->
        <g class="dim"><line x1="878" y1="158" x2="878" y2="290"/><line x1="874" y1="158" x2="882" y2="158"/><line x1="874" y1="290" x2="882" y2="290"/></g>
        <text x="890" y="162" class="t-lab3">1.0 g · rim</text>
        <text x="890" y="226" class="t-lab3">↑ gravity</text>
        <text x="890" y="238" class="t-lab3">fades</text>
        <text x="890" y="292" class="t-lab3">0 g · axis</text>

        <!-- callouts -->
        <g class="t-lab">
          <line x1="500" y1="290" x2="500" y2="112" class="thin"/><circle cx="500" cy="290" r="2.5" class="fill-l"/>
          <text x="500" y="104" text-anchor="middle" class="t-acc-l">AXIAL SUN-CORD (0 g)</text>
          <line x1="452" y1="166" x2="452" y2="96" class="thin"/><circle cx="452" cy="166" r="2" class="fill-c"/>
          <text x="360" y="90" class="t-acc-c">INNER LAND SURFACE — six biomes</text>
          <line x1="806" y1="230" x2="806" y2="120" class="thin"/><circle cx="806" cy="230" r="2" style="fill:#6b7d55"/>
          <text x="806" y="112" text-anchor="middle" class="t-lab3">ENDCAP FARM TERRACES</text>
        </g>

        <!-- scale bar -->
        <g transform="translate(70 462)">
          <line x1="0" y1="0" x2="120" y2="0" class="edge2"/>
          <g class="thin"><line x1="0" y1="-4" x2="0" y2="4"/><line x1="60" y1="-4" x2="60" y2="4"/><line x1="120" y1="-4" x2="120" y2="4"/></g>
          <text x="0" y="15" class="t-dim">0</text><text x="60" y="15" class="t-dim" text-anchor="middle">1</text><text x="120" y="15" class="t-dim" text-anchor="middle">2 km</text>
        </g>
      
        <!-- ===== BORDER · NOTES · TITLE BLOCK ===== -->
        <rect x="8" y="8" width="944" height="606" fill="none" stroke="rgba(150,196,176,.30)" stroke-width="1.5"/>
        <rect x="14" y="14" width="932" height="594" fill="none" stroke="rgba(150,196,176,.16)" stroke-width="0.8"/>
        <line x1="14" y1="528" x2="946" y2="528" stroke="rgba(150,196,176,.30)" stroke-width="1"/>
