        <text x="30" y="546" font-family="ui-monospace,'SF Mono','Menlo','Cascadia Code','Roboto Mono',monospace" font-size="10" letter-spacing="2" fill="#e6ac6d">GENERAL NOTES</text>
        <text x="30" y="563" font-family="ui-monospace,'SF Mono','Menlo','Cascadia Code','Roboto Mono',monospace" font-size="9.5" fill="#a9c2b6">1  Section on the spin axis.</text>
        <text x="30" y="578" font-family="ui-monospace,'SF Mono','Menlo','Cascadia Code','Roboto Mono',monospace" font-size="9.5" fill="#a9c2b6">2  Gravity fades 1 g (rim) → 0 g (axis).</text>
        <text x="30" y="593" font-family="ui-monospace,'SF Mono','Menlo','Cascadia Code','Roboto Mono',monospace" font-size="9.5" fill="#a9c2b6">3  Axial sun-cord lights biomes from within.</text>
        <text x="30" y="608" font-family="ui-monospace,'SF Mono','Menlo','Cascadia Code','Roboto Mono',monospace" font-size="9.5" fill="#a9c2b6">4  Endcaps are terraced 0-g farms.</text>
