<svg viewBox="-12.0 -12.0 1026.0 366.0" role="img" aria-label="Sustainability ladder over log time: self-heal in minutes, buffers over days-weeks, indefinite closed-loop operation over years-decades while light and a resource body are available, deep-time genome drift held by the archive, and the ten-thousand-year dormancy wall; three external dependencies reset the clock." xmlns="http://www.w3.org/2000/svg"><style><![CDATA[
*{box-sizing:border-box}body{margin:0}
  .page{background:radial-gradient(1100px 640px at 82% -6%,rgba(84,207,124,.13),transparent 60%),radial-gradient(900px 520px at 6% 3%,rgba(79,214,208,.11),transparent 55%),#0a1512;color:#e2f0e8;font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:16.5px;line-height:1.66;letter-spacing:.005em;overflow-x:hidden;min-height:100vh}
  .wrap{max-width:1180px;margin:0 auto;padding:0 22px}
  h1,h2,h3,h4{font-family:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif;font-weight:600;text-wrap:balance;line-height:1.12;margin:0}
  p{margin:0 0 1.05em}strong{color:#e2f0e8;font-weight:600}em{color:#e2f0e8}
  a{color:#4fd6d0}
  .mono{font-family:ui-monospace,'SF Mono','Menlo','Cascadia Code','Roboto Mono',monospace}
  .chem{font-family:ui-monospace,'SF Mono','Menlo','Cascadia Code','Roboto Mono',monospace;font-size:.92em;color:#e6ac6d;background:rgba(230,172,109,.13);padding:.06em .4em;border-radius:4px;white-space:nowrap}

  .prog-nav{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;font-family:ui-monospace,'SF Mono','Menlo','Cascadia Code','Roboto Mono',monospace;font-size:11px;letter-spacing:.08em;padding:16px 0 4px}
  .prog-nav .pn-brand{color:#54cf7c;letter-spacing:.16em;text-transform:uppercase}
  .prog-nav a{color:#7c9689;text-decoration:none;padding:3px 10px;border:1px solid rgba(150,196,176,.16);border-radius:999px;transition:color .2s,border-color .2s}
  .prog-nav a:hover{color:#e2f0e8;border-color:rgba(150,196,176,.30)}
  .prog-nav a.current{color:#4fd6d0;border-color:#4fd6d0}

  header.mast{padding:34px 0 30px;border-bottom:1px solid rgba(150,196,176,.30)}
  .mast .kick{font-family:ui-monospace,'SF Mono','Menlo','Cascadia Code','Roboto Mono',monospace;font-size:12px;letter-spacing:.26em;text-transform:uppercase;color:#54cf7c;margin:0 0 16px}
  .mast h1{font-size:clamp(2.2rem,6vw,4rem);letter-spacing:-.015em;margin:0 0 8px}
  .mast h1 .s{color:#54cf7c}
  .mast .sub{font-family:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif;font-style:italic;font-size:clamp(1.05rem,2.3vw,1.4rem);color:#a9c2b6;max-width:60ch}

  /* table of contents */
  .toc{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin:26px 0 0}
  .toc a{display:flex;gap:10px;align-items:baseline;text-decoration:none;color:#e2f0e8;border:1px solid rgba(150,196,176,.16);border-radius:10px;padding:12px 14px;background:#0b1714;transition:border-color .2s}
  .toc a:hover{border-color:rgba(150,196,176,.30)}
  .toc .n{font-family:ui-monospace,'SF Mono','Menlo','Cascadia Code','Roboto Mono',monospace;font-size:12px;color:#54cf7c}
  .toc .t{font-size:14px}

  section.doc{padding:48px 0;border-bottom:1px solid rgba(150,196,176,.16)}
  .eyebrow{font-family:ui-monospace,'SF Mono','Menlo','Cascadia Code','Roboto Mono',monospace;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#7c9689;display:flex;align-items:center;gap:.7em;margin:0 0 16px}
  .eyebrow .num{color:#54cf7c}.eyebrow .rule{flex:1;height:1px;background:rgba(150,196,176,.16)}
  section.doc h2{font-size:clamp(1.7rem,4vw,2.5rem);letter-spacing:-.01em;margin-bottom:14px}
  section.doc h3{font-size:1.28rem;margin:30px 0 10px;color:#e2f0e8}
  section.doc h4{font-family:ui-monospace,'SF Mono','Menlo','Cascadia Code','Roboto Mono',monospace;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#e6ac6d;margin:22px 0 8px}
  .flow{max-width:70ch}
  .flow p,.lead{max-width:70ch}
  .lead{font-size:1.12em;color:#a9c2b6;margin-bottom:24px}

  .callout{border-left:2px solid #54cf7c;background:rgba(84,207,124,.13);padding:14px 18px;border-radius:0 10px 10px 0;margin:22px 0;max-width:70ch}
  .callout.warm{border-color:#e6ac6d;background:rgba(230,172,109,.13)}
  .callout.cool{border-color:#4fd6d0;background:rgba(79,214,208,.11)}
  .callout p{margin:0}.callout .lab{font-family:ui-monospace,'SF Mono','Menlo','Cascadia Code','Roboto Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#7c9689;display:block;margin-bottom:6px}

  .tbl-wrap{overflow-x:auto;margin:18px 0;border:1px solid rgba(150,196,176,.16);border-radius:10px}
  .fig{border:1px solid rgba(150,196,176,.30);border-radius:10px;background:#0e1c18;padding:10px;margin:16px 0;overflow-x:auto}
  .fig svg{display:block;width:100%;min-width:720px;height:auto}
  .figcap{font-size:.82em;color:#7c9689;margin:8px 2px 0;line-height:1.5}
  table{border-collapse:collapse;width:100%;min-width:640px;font-size:13.5px}
  thead th{font-family:ui-monospace,'SF Mono','Menlo','Cascadia Code','Roboto Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#7c9689;font-weight:600;text-align:left;padding:12px 14px;background:#0b1714;border-bottom:1px solid rgba(150,196,176,.30)}
  td{padding:11px 14px;border-bottom:1px solid rgba(150,196,176,.16);vertical-align:top;color:#a9c2b6}
  tbody tr:last-child td{border-bottom:none}
  td:first-child{color:#e2f0e8;font-family:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif;font-size:14.5px}
  td .r{font-family:ui-monospace,'SF Mono','Menlo','Cascadia Code','Roboto Mono',monospace;font-size:11px;color:#54cf7c}

  .pathway{font-family:ui-monospace,'SF Mono','Menlo','Cascadia Code','Roboto Mono',monospace;font-size:12.5px;line-height:1.9;color:#a9c2b6;background:#0b1714;border:1px solid rgba(150,196,176,.16);border-radius:10px;padding:16px 18px;margin:16px 0;overflow-x:auto}
  .pathway .step{color:#e2f0e8}.pathway .en{color:#4fd6d0}.pathway b{color:#e6ac6d}

  .gap{font-family:ui-monospace,'SF Mono','Menlo','Cascadia Code','Roboto Mono',monospace;font-size:11px;letter-spacing:.06em;color:#e6ac6d;display:inline-block;border:1px solid #e6ac6d;border-radius:6px;padding:1px 7px;margin-left:4px}
  sup.cite{font-size:.62em;line-height:0;vertical-align:super;font-family:ui-monospace,'SF Mono','Menlo','Cascadia Code','Roboto Mono',monospace;font-weight:600}
  sup.cite a{color:#4fd6d0;text-decoration:none;padding:0 1px}
  sup.cite a:hover{text-decoration:underline}
  .refs{margin-top:18px;border-top:1px solid rgba(150,196,176,.16);padding-top:18px}
  .refs h3{font-family:ui-monospace,'SF Mono','Menlo','Cascadia Code','Roboto Mono',monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#e6ac6d;margin-bottom:14px}
  .refs ol{margin:0;padding-left:2.4em;display:grid;gap:8px}
  .refs li{font-size:.82em;line-height:1.5;color:#a9c2b6;max-width:80ch}
  .refs li a{color:#4fd6d0;text-decoration:none}
  .refs .rt{color:#7c9689;font-style:italic}
  .refs-note{font-size:.8em;color:#7c9689;margin:0 0 14px;max-width:78ch}
  .real{color:#54cf7c}

  .notes-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-top:8px}
  .note{border-left:2px solid rgba(150,196,176,.30);padding:2px 0 2px 16px}
  .note .nh{font-family:ui-monospace,'SF Mono','Menlo','Cascadia Code','Roboto Mono',monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#7c9689;margin-bottom:7px}
  .note p{font-size:13px;color:#a9c2b6;margin:0;line-height:1.55}
  .note.grn{border-color:#54cf7c}.note.warm{border-color:#e6ac6d}.note.cool{border-color:#4fd6d0}

  footer{padding:34px 0 66px}
  .fbar{display:flex;flex-wrap:wrap;gap:6px 16px;font-family:ui-monospace,'SF Mono','Menlo','Cascadia Code','Roboto Mono',monospace;font-size:11px;color:#7c9689;border-top:1px solid rgba(150,196,176,.16);padding-top:20px}
  .fbar .sep{color:rgba(150,196,176,.30)}
  .reveal{opacity:0;transform:translateY(12px);transition:opacity .6s ease,transform .6s ease}
  .reveal.in{opacity:1;transform:none}
  
  ::selection{background:#54cf7c;color:#0a1512}
  :focus-visible{outline:2px solid #4fd6d0;outline-offset:3px;border-radius:3px}
]]></style><rect x="-12.0" y="-12.0" width="1026.0" height="366.0" fill="#0c1613"/>
        <rect x="90.0" y="80" width="149.1" height="150" rx="6" fill="#54cf7c" fill-opacity=".09" stroke="#54cf7c" stroke-opacity=".5"/>
        <text x="164.5" y="104" text-anchor="middle" font-family="'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif" font-size="13" fill="#54cf7c">self-heal</text>
        <text x="164.5" y="124" text-anchor="middle" font-family="ui-monospace,'SF Mono','Menlo','Cascadia Code','Roboto Mono',monospace" font-size="8" fill="#a9c2b6">breach sealed in</text>
        <text x="164.5" y="136" text-anchor="middle" font-family="ui-monospace,'SF Mono','Menlo','Cascadia Code','Roboto Mono',monospace" font-size="8" fill="#a9c2b6">seconds–minutes</text>
        <text x="164.5" y="160" text-anchor="middle" font-family="ui-monospace,'SF Mono','Menlo','Cascadia Code','Roboto Mono',monospace" font-size="8" fill="#7c9689">(clot / sphincter</text>
        <text x="164.5" y="172" text-anchor="middle" font-family="ui-monospace,'SF Mono','Menlo','Cascadia Code','Roboto Mono',monospace" font-size="8" fill="#7c9689">bulkhead)</text>
        <rect x="239.1" y="80" width="149.1" height="150" rx="6" fill="#4fd6d0" fill-opacity=".09" stroke="#4fd6d0" stroke-opacity=".5"/>
        <text x="313.6" y="104" text-anchor="middle" font-family="'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif" font-size="13" fill="#4fd6d0">buffers</text>
        <text x="313.6" y="124" text-anchor="middle" font-family="ui-monospace,'SF Mono','Menlo','Cascadia Code','Roboto Mono',monospace" font-size="8" fill="#a9c2b6">atmosphere &amp; water</text>
        <text x="313.6" y="136" text-anchor="middle" font-family="ui-monospace,'SF Mono','Menlo','Cascadia Code','Roboto Mono',monospace" font-size="8" fill="#a9c2b6">reserves ride out outages</text>
        <text x="313.6" y="160" text-anchor="middle" font-family="ui-monospace,'SF Mono','Menlo','Cascadia Code','Roboto Mono',monospace" font-size="8" fill="#7c9689">(ARCA: ~140 yr O₂ reserve)</text>
        <rect x="388.2" y="80" width="223.6" height="150" rx="6" fill="#54cf7c" fill-opacity=".09" stroke="#54cf7c" stroke-opacity=".5"/>
        <text x="500.0" y="104" text-anchor="middle" font-family="'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif" font-size="13" fill="#54cf7c">closed loop</text>
        <text x="500.0" y="124" text-anchor="middle" font-family="ui-monospace,'SF Mono','Menlo','Cascadia Code','Roboto Mono',monospace" font-size="8" fill="#a9c2b6">indefinite steady state —</text>
        <text x="500.0" y="136" text-anchor="middle" font-family="ui-monospace,'SF Mono','Menlo','Cascadia Code','Roboto Mono',monospace" font-size="8" fill="#a9c2b6">air/water/N/food</text>
        <text x="500.0" y="148" text-anchor="middle" font-family="ui-monospace,'SF Mono','Menlo','Cascadia Code','Roboto Mono',monospace" font-size="8" fill="#a9c2b6">regenerate</text>
        <text x="500.0" y="160" text-anchor="middle" font-family="ui-monospace,'SF Mono','Menlo','Cascadia Code','Roboto Mono',monospace" font-size="8" fill="#7c9689">limit: leakage, re-mined</text>
        <text x="500.0" y="172" text-anchor="middle" font-family="ui-monospace,'SF Mono','Menlo','Cascadia Code','Roboto Mono',monospace" font-size="8" fill="#7c9689">from ice</text>
        <rect x="611.8" y="80" width="149.1" height="150" rx="6" fill="#e6ac6d" fill-opacity=".09" stroke="#e6ac6d" stroke-opacity=".5"/>
        <text x="686.4" y="104" text-anchor="middle" font-family="'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif" font-size="13" fill="#e6ac6d">deep time</text>
        <text x="686.4" y="124" text-anchor="middle" font-family="ui-monospace,'SF Mono','Menlo','Cascadia Code','Roboto Mono',monospace" font-size="8" fill="#a9c2b6">genome drift &amp;</text>
        <text x="686.4" y="136" text-anchor="middle" font-family="ui-monospace,'SF Mono','Menlo','Cascadia Code','Roboto Mono',monospace" font-size="8" fill="#a9c2b6">scarce-element attrition</text>
        <text x="686.4" y="160" text-anchor="middle" font-family="ui-monospace,'SF Mono','Menlo','Cascadia Code','Roboto Mono',monospace" font-size="8" fill="#7c9689">held by CHORUS re-sync +</text>
        <text x="686.4" y="172" text-anchor="middle" font-family="ui-monospace,'SF Mono','Menlo','Cascadia Code','Roboto Mono',monospace" font-size="8" fill="#7c9689">ongoing mining</text>
        <rect x="760.9" y="80" width="149.1" height="150" rx="6" fill="#e6ac6d" fill-opacity=".09" stroke="#e6ac6d" stroke-opacity=".5"/>
        <text x="835.5" y="104" text-anchor="middle" font-family="'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif" font-size="13" fill="#e6ac6d">dormancy wall</text>
        <text x="835.5" y="124" text-anchor="middle" font-family="ui-monospace,'SF Mono','Menlo','Cascadia Code','Roboto Mono',monospace" font-size="8" fill="#a9c2b6">a vitrified seed's</text>
        <text x="835.5" y="136" text-anchor="middle" font-family="ui-monospace,'SF Mono','Menlo','Cascadia Code','Roboto Mono',monospace" font-size="8" fill="#a9c2b6">radiation limit</text>
        <text x="835.5" y="160" text-anchor="middle" font-family="ui-monospace,'SF Mono','Menlo','Cascadia Code','Roboto Mono',monospace" font-size="8" fill="#7c9689">then DNA-archive</text>
        <text x="835.5" y="172" text-anchor="middle" font-family="ui-monospace,'SF Mono','Menlo','Cascadia Code','Roboto Mono',monospace" font-size="8" fill="#7c9689">re-synthesis</text>
        <line x1="90" y1="230" x2="910" y2="230" stroke="rgba(150,196,176,.30)"/>
        <line x1="90.0" y1="230" x2="90.0" y2="234" stroke="rgba(150,196,176,.30)"/>
        <text x="90.0" y="246" text-anchor="middle" font-family="ui-monospace,'SF Mono','Menlo','Cascadia Code','Roboto Mono',monospace" font-size="8.5" fill="#7c9689">~5 min</text>
        <line x1="239.1" y1="230" x2="239.1" y2="234" stroke="rgba(150,196,176,.30)"/>
        <text x="239.1" y="246" text-anchor="middle" font-family="ui-monospace,'SF Mono','Menlo','Cascadia Code','Roboto Mono',monospace" font-size="8.5" fill="#7c9689">~9 hr</text>
        <line x1="388.2" y1="230" x2="388.2" y2="234" stroke="rgba(150,196,176,.30)"/>
        <text x="388.2" y="246" text-anchor="middle" font-family="ui-monospace,'SF Mono','Menlo','Cascadia Code','Roboto Mono',monospace" font-size="8.5" fill="#7c9689">~5 wk</text>
        <line x1="462.7" y1="230" x2="462.7" y2="234" stroke="rgba(150,196,176,.30)"/>
        <text x="462.7" y="246" text-anchor="middle" font-family="ui-monospace,'SF Mono','Menlo','Cascadia Code','Roboto Mono',monospace" font-size="8.5" fill="#7c9689">1 yr</text>
        <line x1="611.8" y1="230" x2="611.8" y2="234" stroke="rgba(150,196,176,.30)"/>
        <text x="611.8" y="246" text-anchor="middle" font-family="ui-monospace,'SF Mono','Menlo','Cascadia Code','Roboto Mono',monospace" font-size="8.5" fill="#7c9689">century</text>
        <line x1="760.9" y1="230" x2="760.9" y2="234" stroke="rgba(150,196,176,.30)"/>
        <text x="760.9" y="246" text-anchor="middle" font-family="ui-monospace,'SF Mono','Menlo','Cascadia Code','Roboto Mono',monospace" font-size="8.5" fill="#7c9689">10 kyr</text>
        <line x1="910.0" y1="230" x2="910.0" y2="234" stroke="rgba(150,196,176,.30)"/>
        <text x="910.0" y="246" text-anchor="middle" font-family="ui-monospace,'SF Mono','Menlo','Cascadia Code','Roboto Mono',monospace" font-size="8.5" fill="#7c9689">1 Myr</text>
        <text x="500" y="262" text-anchor="middle" font-family="ui-monospace,'SF Mono','Menlo','Cascadia Code','Roboto Mono',monospace" font-size="9" fill="#7c9689">time (log) — how long the system carries life before something must be topped up</text>
        <text x="40" y="60" font-family="ui-monospace,'SF Mono','Menlo','Cascadia Code','Roboto Mono',monospace" font-size="10" fill="#e2f0e8">Sustainability ladder — self-sustaining, not resupplied</text>
        <text x="30" y="296" font-family="ui-monospace,'SF Mono','Menlo','Cascadia Code','Roboto Mono',monospace" font-size="9" fill="#e6ac6d">RESET THE CLOCK — three things the system cannot make for itself:</text>
        <text x="30" y="314" font-family="ui-monospace,'SF Mono','Menlo','Cascadia Code','Roboto Mono',monospace" font-size="8.5" fill="#e2f0e8">① light</text>
        <text x="128" y="314" font-family="ui-monospace,'SF Mono','Menlo','Cascadia Code','Roboto Mono',monospace" font-size="8.5" fill="#a9c2b6">sun or piped — energy for photosynthesis; remove it → dormancy</text>
        <text x="30" y="329" font-family="ui-monospace,'SF Mono','Menlo','Cascadia Code','Roboto Mono',monospace" font-size="8.5" fill="#e2f0e8">② a resource body</text>
        <text x="128" y="329" font-family="ui-monospace,'SF Mono','Menlo','Cascadia Code','Roboto Mono',monospace" font-size="8.5" fill="#a9c2b6">rock + ice — element &amp; volatile make-up; remove it → a finite reserve</text>
        <text x="30" y="344" font-family="ui-monospace,'SF Mono','Menlo','Cascadia Code','Roboto Mono',monospace" font-size="8.5" fill="#e2f0e8">③ genome archive</text>
        <text x="128" y="344" font-family="ui-monospace,'SF Mono','Menlo','Cascadia Code','Roboto Mono',monospace" font-size="8.5" fill="#a9c2b6">CHORUS master — genetic stability; remove it → drift wins over centuries</text>
        </svg>